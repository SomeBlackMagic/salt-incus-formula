# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Expected merged mapdata for Ubuntu 24.04 (amd64)
# Merge order: defaults.yaml + osarch/amd64.yaml + os_family/Debian.yaml + pillar
---
values:
  enable: true
  arch: amd64

  repo:
    enable: false
    debian:
      name: 'deb [arch=amd64] https://pkgs.zabbly.com/incus/stable bookworm main'
      human_name: 'Zabbly Incus repository'
      uri: 'https://pkgs.zabbly.com/incus/stable'
      dist: 'bookworm'
      comps:
        - main
      architecture: amd64
      channel: stable
      key_url: 'https://pkgs.zabbly.com/key.asc'
    redhat:
      name: 'incus-stable'
      baseurl: 'https://pkgs.zabbly.com/incus/stable/rpm/$releasever/$basearch'
      gpgkey: 'https://pkgs.zabbly.com/key.asc'
      enabled: 1
      gpgcheck: 1

  pkg:
    name: incus
    deps:
      - python3-cryptography
      - qemu-kvm
      - lxcfs

  connection:
    type: 'unix'
    socket: /var/lib/incus/unix.socket

  api_client:
    enabled: false
    generate_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
    import_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
    salt_cloud_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
    generate:
      cn: salt-cloud
      days: 3650

  global:
    lxcfs:
      enable: false
      modules:
        loadavg: true
        cfs: true
        memory: true
        cpuset: true
        sysinfo: true
        pidfd: true

  service:
    name: incus
    enable: true

  images: {}
  instances: {}
  instance_snapshots: {}
  storage_pools: {}
  storage_volumes: {}
  volume_snapshots: {}
  volume_attachments: {}
  networks: {}
  network_acls: {}
  network_forwards: {}
  network_peers: {}
  network_zones: {}
  profiles: {}
  server_settings: {}
  server_settings_individual: {}
  snapshot_rotation: {}
  cluster: {}

  map_jinja:
    sources:
      - "Y:G@osarch"
      - "Y:G@os_family"
      - "Y:G@os"
      - "Y:G@osfinger"
      - "C@incus:lookup"
      - "C@incus"
      - "Y:G@id"
