# -*- coding: utf-8 -*-
# vim: ft=yaml
---
values:
  api_client:
    enabled: false
    generate:
      cn: salt-cloud
      days: 3650
    generate_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
    import_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
    salt_cloud_storage:
      cert: /etc/salt/pki/incus/client.crt
      key: /etc/salt/pki/incus/client.key
  arch: amd64
  cluster: {}
  connection:
    socket: /var/lib/incus/unix.socket
    type: unix
  enable: true
  global:
    lxcfs:
      enable: false
      modules:
        cfs: true
        cpuset: true
        loadavg: true
        memory: true
        pidfd: true
        sysinfo: true
  images: {}
  instance_snapshots: {}
  instances: {}
  map_jinja:
    sources:
      - Y:G@osarch
      - Y:G@os_family
      - Y:G@os
      - Y:G@osfinger
      - C@incus:lookup
      - C@incus
      - Y:G@id
  network_acls: {}
  network_forwards: {}
  network_peers: {}
  network_zones: {}
  networks: {}
  pkg:
    deps:
      - python3-cryptography
      - lxcfs
    name: incus
  profiles: {}
  repo:
    channel: stable
    debian:
      architecture: amd64
      channel: stable
      comps:
        - main
      dist: bookworm
      human_name: Zabbly Incus repository
      key_url: https://pkgs.zabbly.com/key.asc
      name: deb [arch=amd64] https://pkgs.zabbly.com/incus/stable bookworm main
      uri: https://pkgs.zabbly.com/incus/stable
    enable: true
    redhat:
      baseurl: https://pkgs.zabbly.com/incus/stable/rpm/$releasever/$basearch
      enabled: 1
      gpgcheck: 1
      gpgkey: https://pkgs.zabbly.com/key.asc
      name: incus-stable
  server_settings: {}
  server_settings_individual: {}
  service:
    enable: true
    name: incus
  snapshot_rotation: {}
  storage_pools: {}
  storage_volumes: {}
  volume_attachments: {}
  volume_snapshots: {}
